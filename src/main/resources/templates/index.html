<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
          rel="stylesheet">


    <!--구글 폰트 Manrope-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">


    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Cosmetics Layout</title>
    <style>
        /* =========================
            기본 리셋 / 공통
         ========================= */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            background: #fafafa;
        }

        .wrap {
            max-width: 95rem; /*전체 레이아웃 최대 폭*/
            margin: 24px auto; /*가운데 정렬*/
            padding: 0 16px; /*좌우 여백*/
        }

        /* 파란 테두리 느낌 */
        .panel {
            border: 2px; /*현재는 실질적 테두리 없음*/
            background: #fff;
        }

        /* =========================
             HERO 영역
            ========================= */

        /* hero + 프로필 묶는 flex 컨테이너 */
        .hero-wrap {
            display: flex;
            flex-direction: row;
            align-items: center; /* 세로 중앙 정렬 */
            gap: 24px;
        }

        /* 상단 큰 이미지(hero) */
        .hero {
            flex: 1 1 auto; /* 가변 폭 */
            min-width: 0;
            border-radius: 0.5rem;
            height: 20rem;
            overflow: hidden;
            position: relative; /* heroText, profile 기준점 */
        }


        /* hero 안의 실제 이미지 */
        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
        }

        /* hero 위 텍스트 */
        .heroText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -300%); /*위쪽으로 띄움*/
            color: #8091a3;
            font-size: 76px;
            font-weight: 300;
            font-family: "Playfair Display", serif;
            font-style: italic;
        }

        /* hero 안 카드: hero의 반 조금 안 되게 */
        /* hero 안 카드: 파스텔 글라스 + 부드러운 핑크 테두리 */
        .hero-profile {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-1%, -50%); /* ✅ 진짜 가운데 */

            width: 50%;
            height: 78%; /* 너무 크면 72~78 사이로 */
            padding: 1.2rem;
            gap: 1rem;

            display: flex;
            align-items: center;

            border-radius: 22px;

            /* ✅ 파스텔 글라스 */
            background: rgba(255, 255, 255, 0.30);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            /* ✅ 연핑크 테두리 (검정 금지) */
            border: 1px solid rgba(255, 190, 220, 0.55);

            /* ✅ 검은 그림자 대신 핑크빛 소프트 그림자 */
            box-shadow: 0 14px 32px rgba(255, 160, 200, 0.18),
            inset 0 0 0 1px rgba(255, 255, 255, 0.35);

            overflow: hidden;
        }

        /* ✅ 이미지 들어갈 상자 */
        .hero-profile .profile-box {
            width: 50%;
            height: 100%;
            padding: 1rem;

            border-radius: 18px;

            /* ✅ “회색 박스” 말고 크림핑크 */
            background: rgba(255, 255, 255, 0.55);

            /* ✅ 옅은 회색 테두리 */
            border: 1px solid rgba(230, 230, 230, 0.9);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* ✅ 이미지 절대 안 잘리게 */
        .hero-profile .profile-box img {
            max-width: 92%;
            max-height: 92%;
            object-fit: contain;
            display: block;
        }

        /* ✅ 오른쪽 텍스트 영역 */
        .hero-profile-text {
            width: 47%;
            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;

            text-align: center;
        }

        /* Personal Color / 톤별 컬러 가이드 */
        .hero-profile-text .name {
            font-size: 15px;
            font-weight: 700;
            color: rgba(60, 60, 60, 0.92);
        }

        .hero-profile-text .sub {
            font-size: 12px;
            font-weight: 500;
            color: rgba(80, 80, 80, 0.72);
        }

        /* 로그아웃 링크도 톤 맞춰서 */
        .hero-profile-text a {
            margin-top: 0.2rem;
            font-size: 12px !important;
            color: rgba(80, 80, 80, 0.7) !important;
            text-decoration: none;
            border-bottom: 1px solid rgba(80, 80, 80, 0.35);
        }

        .hero-profile-text a:hover {
            color: rgba(50, 50, 50, 0.9) !important;
            border-bottom-color: rgba(50, 50, 50, 0.6);
        }

        /* ✅ 하트: 세로 2개 중앙 유지 + 크기 먹게 */
        .heart-wrap {
            margin-top: 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.7rem;
        }

        /* ⚠️ img는 width/height 잘 먹는데,
           안 먹는 경우는 상위 CSS가 덮거나, display가 이상해서임.
           여기서 확실히 잡아줌 */
        .heart-icon {
            width: 52px !important;
            height: 52px !important;
            display: block;
            object-fit: contain;
            opacity: 0.92;
            filter: drop-shadow(0 6px 10px rgba(255, 140, 190, 0.18));
        }


        /* =========================
           BANNER 영역 (중앙 배너)
           ========================= */

        /* 2) 배너 전체 컨테이너 */
        .banner {
            margin-top: 18px;
            height: 13rem; /*배너 전체 높이*/
            display: flex;
            gap: 14px;
            padding: 14px; /*이 padding 떄문에 체감 중앙이 헷갈릴 수 있음*/
            align-items: center;
        }

        /*배너 왼쪽 영역 (이미지 + 시계)*/
        .banner .text {
            width: 50%;
            height: 8rem; /* 배너보다 작음 */
            overflow: hidden;
            border-radius: 10px;
        }

        /*배너 이미지 공통*/
        .banner-left img,
        .banner .text img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* =========================
            🔥 시계 관련 (핵심)
            ========================= */

        /*
        banner-left
         → 시계가 기준 삼는 "부모"
         → position: relative 가 반드시 있어야
           banner-clock 의 absolute 가 먹힘
        */
        .banner-left {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /*
        banner-clock
        → 이미지 위에 덮는 투명 레이어
        → inset:0 으로 부모 전체 덮기
        → grid + place-items 로 정확한 정중앙
        */
        .banner-left .banner-clock {
            position: absolute;
            inset: 0; /*부모(.banner-left) 기준 전체*/
            display: grid;
            place-items: center; /* 🔥 진짜 중앙 */
            pointer-events: none; /* 클릭 방해 X */
            background: transparent;
        }

        /*
        실제 시계 글자
        → clamp + vw 때문에 반응형
        */
        .banner-left .banner-clock #clock {
            font-family: "Playfair Display", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            font-weight: 700;

            font-size: clamp(28px, 3.8vw, 64px); /* 반응형 크기 */
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.96);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45),
            0 1px 2px rgba(0, 0, 0, 0.65);
        }

        /* =========================
           HERO 프로필 텍스트
           ========================= */

        /*
         프로필 카드 안 메인 텍스트
         예: "Personal Color"
        */
        .hero-profile-text .name {
            font-size: 14px; /*작은 제목*/
            font-weight: 600;
            color: #333;
        }

        /*
        프로필 카드 안 서브 텍스트
        예: "톤별 컬러 가이드"
        */
        .hero-profile-text .sub {
            font-size: 12px; /*보조 설명*/
            color: #666;
        }

        /* =========================
            BANNER 래퍼
            ========================= */

        /*
        banner-wrap
        - 배너 전체를 감싸는 컨테이너
        - absolute 요소(시계, 오버레이 등)를
          배너 "전체 기준"으로 잡고 싶을 때 쓰는 기준점
        - 지금 구조에서는 실제 시계 기준은 banner-left라
          시계랑 직접적인 연결은 없음
        */
        .banner-wrap {
            position: relative; /* 배너 전체 기준 */
        }

        /* =========================
           프로필 이미지 (좌측 hero 옆 카드용)
           ========================= */

        /*
         profile 클래스 안의 이미지
         → hero 옆에 따로 두던 원형 프로필 카드용
         → hero-profile img 와는 다른 용도 (구형/보조 UI)
        */
        .profile img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 캐릭터 잘림 방지 */
            display: block;
        }

        /* =========================
           배너 왼쪽(text) 영역
           ========================= */

        /*
         banner .text img
         → 배너 왼쪽 이미지
         → 시계가 올라가는 배경 이미지
        */
        .banner .text img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /*
         배너 왼쪽 안에 글자 쓰던 시절용
         (지금은 거의 사용 안 함)
        */
        .banner .text .title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .banner .text .sub {
            color: #555;
            font-size: 14px;
        }

        /* =========================
           배너 오른쪽(imgbox) 영역
           ========================= */

        /*
         banner 오른쪽 이미지 박스
         → 현재는 주석 처리되어 있지만
           다시 쓸 수 있게 남아있는 구조
        */
        .banner .imgbox {
            width: 50%;
            height: 8rem;
            overflow: hidden;
            border-radius: 10px;
        }

        .banner .imgbox img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
        }

        /* =========================
           하단 컨텐츠 전체 래퍼
           ========================= */

        /*
         bottom
         → 추천 영역 + 정보 영역 감싸는 컨테이너
         → grid로 바꿀 수 있도록 여지 남겨둠
        */
        .bottom {
            margin-top: 18px;
            gap: 18px;
        }

        /* =========================
           공통 박스(panel 안 내용)
           ========================= */

        /*
         box
         → 하단 패널 내부 기본 여백/최소 높이
        */
        .box {
            min-height: 220px;
            padding: 14px;
        }

        .box h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        /* =========================
           추천 카드 (rec-item)
           ========================= */

        /*
         rec-item
         → 퍼스널 컬러 카드 1개 단위
        */
        .rec-item {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-top: 1px solid #eee;
            padding: 1.6rem;
            gap: 0.8rem;
            border-radius: 0.8rem;
        }

        /*
         rec-item 상단 (제목 + 판매처)
        */
        .rec-item .up {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /*
         rec-item 하단 (이미지 묶음 + 버튼)
        */
        .rec-item .down {
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 0.6rem;
            border: 1px solid #dadada;
            padding: 1rem;
            gap: 1.8rem;
        }

        /*
         rec-item 이미지 상단 묶음
        */

        .rec-item .down .container-up {
            display: flex;
            flex-direction: row;
            gap: 1.8rem;
        }

        /*
         이미지 하나(oneBox)
        */
        .rec-item .down .container-up .oneBox {
            width: 22rem;
            border-radius: 0.3rem;
        }

        /*
         rec-item 하단 "더보기" 영역
        */
        .rec-item .down .container-down {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 3rem;
            font-size: 16px;
            color: #555;
        }

        /*
         첫 번째 카드 상단선 제거
        */
        .rec-item:first-of-type {
            border-top: none;
        }

        /*
         카드 안 링크 / 판매처
        */
        .rec-item a {
            text-decoration: none;
            color: #555;
            font-weight: 600;
        }

        .rec-item .seller {
            color: #777;
            font-size: 12px;
            margin-top: 4px;
        }

        /* =========================
           추천 카드 내부 이미지
           ========================= */

        /*
        oneBox
        → 정사각형 이미지 컨테이너
        */
        .oneBox {
            aspect-ratio: 1/1;
            width: 15rem;
            height: 15rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /*
         실제 이미지
        */
        .boxImg {
            width: 95%;
            height: 95%;
            border-radius: 0.5rem;
            object-fit: contain;
        }

        /* =========================
             더보기 버튼
            ========================= */

        /*
        rec-item 안 "더보기"
        */
        .moreBtn {
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }

        /* =========================
           모달 (색상 전체보기)
           ========================= */

        /*
         modalOverlay
         → 화면 전체를 덮는 반투명 배경
        */
        .modalOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35); /* 회색 반투명 */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /*
         modalPanel
         → 실제 모달 박스
        */
        .modalPanel {
            width: min(900px, 92vw);
            background: #f6f1e6;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            position: relative; /*닫기 버튼 기준*/
        }

        /*
         닫기 버튼
        */
        .modalClose {
            position: absolute;
            top: 38px;
            right: 44px;
            border: 0;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
        }

        /*
        모달 내부 스크롤 영역
        */
        .modalBody {
            margin-top: 10px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 6px;
        }

        /*
        모달 안 이미지 그리드
        */
        .modalGrid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        /*
        모달 이미지 박스
        */
        .modalBox {
            aspect-ratio: 1/1;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modalBox img {
            width: 92%;
            height: 92%;
            object-fit: contain;
        }

        /* =========================
           우측 하단 정보 리스트 (box_info)
           ========================= */

        /*
         info-row
         → "배송/할인/적립" 같은 한 줄 정보 1개 단위
         → 좌측(label) + 우측(value)를 양끝으로 벌려 배치
        */
        .info-row {
            display: flex; /* label / value를 가로로 배치 */
            justify-content: space-between; /* 양끝 정렬 */
            padding: 10px 0; /* 위아래 여백 */
            border-top: 1px solid #eee; /* 줄 구분선 */
        }

        /*
         첫 줄에는 구분선 없애기
        */
        .info-row:first-of-type {
            border-top: none;
        }

        /*
         라벨(왼쪽 글자): "배송", "할인", "적립"
        */
        .info-row .label {
            color: #555;
            font-weight: 600; /* 라벨은 조금 강조 */
        }

        /*
         값(오른쪽 글자): "무료/내일도착", "첫 구매 10%" 등
        */
        .info-row .value {
            color: #555;
            margin-left: 12px; /* 라벨과 너무 붙지 않게 */
            text-align: right; /* 오른쪽 정렬 */
        }

        /* =========================
            추천 카드 내부 down 영역 공통
           ========================= */

        /*
         down
         → rec-item 내부에서 이미지/버튼을 담는 아래 영역(.down)
         → width:100%로 내부 꽉 채우고 높이는 내용에 따라 자동
        */
        .down {
            height: auto;
            width: 100%;
        }

        /* =========================
           퍼스널 컬러 톤 배경색 클래스
           ========================= */

        /*
         tone-1 ~ tone-4
         → 추천 카드 배경색(봄/여름/가을/겨울)
         → 현재는 r.id를 이용해서 classappend로 붙이는 구조
        */
        .tone-1 { /* 봄 */
            background-color: #EFD7DB;
        }

        .tone-2 { /* 여름 */
            background-color: #D7E6EF;
        }

        .tone-3 { /* 가을 */
            background-color: #EFE2D7;
        }

        .tone-4 { /* 겨울 */
            background-color: #E6D7EF;
        }

        /* =========================
           로그인 모달 UI
           ========================= */

        /*
        login-modal
        → 화면 전체를 덮는 어두운 배경 + 가운데 정렬
        → modalOverlay랑 같은 역할이지만 "로그인용"으로 따로 있음
        */
        .login-modal {
            position: fixed;
            inset: 0; /* 화면 전체 덮기 */
            background: rgba(0, 0, 0, 0.4); /* 어두운 반투명 배경 */
            display: flex;
            justify-content: center; /* 가로 중앙 */
            align-items: center; /* 세로 중앙 */
            z-index: 10000; /* 다른 UI 위로 */
        }

        /*
         login-panel
         → 로그인 모달 안의 흰 박스 본체
        */
        .login-panel {
            width: 30rem; /* 모달 박스 폭 */
            background: #fff;
            border-radius: 14px;
            padding: 5rem;
            text-align: center;
            position: relative; /* 닫기 버튼 기준점 */
        }

        /*
         로그인 모달 제목 (간편 로그인)
        */
        .login-panel h3 {
            font-weight: 300;
            margin-bottom: 3rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
        }

        /*
         로그인 버튼 공통 스타일
         → a 태그를 버튼처럼 보이게 만드는 역할
        */
        .login-btn {
            display: block;
            width: 100%;
            height: 44px;

            <div th:each="r : ${recs}" th:style=" 'background-color:' + ${r.bgColorHex} " class="rec-item">

                        <!--st =-->

                        <!--r.boxes[0] -> 그 톤의 대표 이미지 1장-->

                        <!--r.boxes 라는 리스트에서 앞의 3개만 꺼내서 div를 만든다는 의미이다.-->
                        <!--b: 리스트의 각 요소 하나-->
                        <!--st: 상태 객체(index, count 등 제공)-->
                        <!--recommendation 의 boxes-->
                        <!--"r.boxes 에 들어있는 요소들을 하나씩 꺼내서, 현재 요소는 b 에 넣고, 반복 상태 정보는 st에 넣어라"-->
                        <!--st 는 몇번 반복한지 나타내는거고 b 는 n번째 반복했을때 요소 이다.-->

                        <div style="display:flex; gap: 18px;">

                                 th:each="b, st : ${r.boxes}" th:if="${st.index < 3}">

                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>


</div>

<script>

    // ======================모달 창======================
    const overlay = document.getElementById("modalOverlay");
    const modalBody = document.getElementById("modalBody");
    const closeBtn = document.getElementById("modalClose");

    function openModal(recId) {
        const tpl = document.getElementById("modal-rec-" + recId);
        if (!tpl) return;

        modalBody.innerHTML = tpl.innerHTML;   // 숨겨둔 내용 복사
        overlay.style.display = "flex";
        document.body.style.overflow = "hidden"; // 뒤 스크롤 막기
    }

    function closeModal() {
        overlay.style.display = "none";
        modalBody.innerHTML = "";
        document.body.style.overflow = "";
    }

    document.querySelectorAll(".moreBtn").forEach(btn => {
        btn.addEventListener("click", () => {
            openModal(btn.dataset.recId);
        });
    });

    closeBtn.addEventListener("click", closeModal);

    // 회색 배경 클릭하면 닫기
    overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeModal();
    });

    const loginBtn = document.getElementById("loginBtn");
    const loginModal = document.getElementById("loginModal");
    const loginClose = document.getElementById("loginClose");

    if (loginBtn && loginModal && loginClose) {
        loginBtn.addEventListener("click", () => {
            loginModal.style.display = "flex";
            document.body.style.overflow = "hidden";
        });

        loginClose.addEventListener("click", () => {
            loginModal.style.display = "none";
            document.body.style.overflow = "";
        });

        loginModal.addEventListener("click", (e) => {
            if (e.target === loginModal) {
                loginModal.style.display = "none";
                document.body.style.overflow = "";
            }
        });
    }


    // ======================시계======================
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');

        document.getElementById('clock').textContent =
            `${h}:${m}:${s}`;
    }


    setInterval(updateClock, 1000);
    updateClock();




































    // ======================날씨======================

    document.addEventListener("DOMContentLoaded", loadWeatherByGeo);
    /*HTML 다 읽자마자 loadWeatherByGeo 실행*/
    /*페이지 열자마자 실행되게 하고 싶으면 씀*/

    // async / await (비동기)
    // 시간이 걸리는 작업(위치 가져오기, 서버 요청)은 기다려야 결과가 나온다
    // await 는 "결과 나올 때까지 잠깐 기다려" 라는 뜻
    // async 는 "이 함수 안에서 await 쓸 거야" 라는 표시
    async function loadWeatherByGeo() {
        /*loadWeatherByGeo 라는 함수 만들게*/
        /*안에 시간이 걸리는 작업이 있어서(await) 기다릴 수도 있어 (그래서 async)*/
        // 사용자의 현재 위치(위도/경도)를 브라우저에서 얻어서 서버(/weather)에 보내고 서버가 준 날씨 JSON 을 화면에 보여주는 코드
        // 시간이 걸리는 작업을 기다리면서도 브라우저가 멈추지 않게 하는 방식
        // 1) 웹페이지가 열림
        // 2) 브라우저가 "위치정보 써도 돼요?" 물어봄 (허용해야 함)
        // 3) 허용하면 브라우저가 현재 위치를 가져옴 (위도/경도) 브라우저에서
        // 4) 그 위치로 서버에 요청함: /weather?lat=...&lon=...
        // 5) 서버가 "그 위치의 날씨 데이터"를 JSON으로 줌
        // 6) renderWeather(data) 가 그걸 화면에 그림

        if (!navigator.geolocation) return;
        /*이 브라우저가 위치기능을 지원 안 하면 그냥 종료할게*/
        // 브라우저가 위치정보 API 를 지원 안 하면 아무것도 안 하고 종료
        // navigator.geolocation (위치 가져오는 기능)
        // 브라우저가 제공하는 "내 위치" 기능
        // 휴대폰 GPS 또는 Wi-Fi/기지국으로 대충 추정함
        navigator.geolocation.getCurrentPosition(async (pos) => {
            /*브라우저에게: 내 현재 위치 좀 가져와줘. 가져오면 그 결과를 pos라는 변수에 넣어서 이 함수(콜백)를 실행해줘*/
            /*여기서 브라우저가 권한 팝업 띄움: 이 사이트가 위치정보를 사용하도록 허용할까요?*/
            // 현재 위치를 가져오고, 성공하면 pos 를 콜백으로 받음(콜백 자체도 async라 await 가능)
            const lat = pos.coords.latitude;
            /*위치 결과 pos 안에는 좌표가 들어있어. 그중 latitude = 위도*/
            // 받은 위치(pos)에서 위도(latitude) 꺼냄

            const lon = pos.coords.longitude;
            /*longitude = 경도*/
            // 받은 위치(pos)에서 경도(longitude) 꺼냄

            // fetch (서버에 요청 보내기)
            // "서버야 데이터 줘" 하고 요청하는 함수
            const res = await fetch(`/weather?lat=${lat}&lon=${lon}`);
            /*서버에 이런 주소로 요청 보내는 거: /weather?lat=37.123&lon=127.456 이런 느낌*/
            /*?lat=...&lon=...은 쿼리스트링이라서 서버야, 이 좌표 기준으로 날씨 줘 라고 전달하는 방식*/
            /*await 는 서버가 답할 때까지 기다려*/

            // JSON (데이터 포맷)
            // 서버가 데이터를 보내는 대표적인 형태
            // 예: {temp: 12, city: "Seoul"} 이런 모양
            const data = await res.json();
            /*서버가 준 응답(res)은 아직 “원시 응답”이라 바로 쓰기 불편해
            .json()으로 “JSON 데이터를 자바스크립트 객체로 변환”
            이것도 시간이 살짝 걸릴 수 있어서 await*/

            renderWeather(data); // 밑에 있는 함수가 바로 renderWeather 이다.
            /*서버가 준 data를 renderWeather 에 그대로 넘김*/
            // 서버 JSON 에 weatherCode 가 있으면 -> data.weatherCode 존재
            // 서버 JSON 에 weatherCode 가 없으면 -> data.weatherCode 없음
        });
    }

    // 위의 함수에서 전달받은 데이터를 여기서 쓴다.
    // 이 함수에서는 실제 JSON 에 적혀있는 temp, location, sky, pty 를 받는다.
    function renderWeather({temp, location, sky, pty}) {
        document.getElementById("weatherTemp").textContent =
            (!(temp === null || temp === undefined)) ? `${Math.round(Number(temp))}°` : "--°";

        document.getElementById("weatherLoc").textContent = location ?? "현재 위치";
        // id 가 weatherLoc 인 태그 안의 텍스트는 location 으로 대체, 만약 undefined 이거나 null 이라면 '현재 위치' 글씨 띄움

        const w = pickWeatherIcon({SKY: sky, PTY: pty});
        // 밑에 있는 아이콘을 정하는 메서드에 sky, pty 값을 각각 SKY, PTY 에 주입하고 받은 결과를 w 에 담는다.

        const imgUrl = pickWeatherBannerImageUrl({SKY: sky, PTY: pty});
        // 밑에 있는 날씨배너의 이미지를 정하는 메서드에 sky, pty 값을 각각 SKY, PTY 에 주입하고 받은 결과를 w 에 담는다.

        document.getElementById("weatherIcon").textContent = w.icon;
        // id 가 weatherIcon 인 태그에서 안의 텍스트를 w 의 아이콘으로 바꾼다.

        document.getElementById("weatherDesc").textContent = w.desc;
        // id 가 weatherDesc 인 태그에서 안의 텍스트를 w 의 desc 으로 바꾼다. (ex) 비/눈)
        // desc: description 의 줄임말

        const imgEl = document.getElementById("weatherBannerImg");
        // id 가 weatherBannerImg 인 태그를 상수 imgEl 에 담는다.

        if (imgEl) imgEl.src = imgUrl;
        // 위에서 만든 상수 imgEl 가 true 라면 id 가 weatherBannerImg 인 태그 (여기선 imgEl) 의 속성 src 가 pickWeatherBannerImageUrl 의 함수안에 결과 값인 사진이 된다.
    }

    // SKY: 1 맑음, 3 구름많음, 4 흐림
    // PTY: 0 없음, 1 비, 2 비/눈, 3 눈, 4 소나기, 5~7(초단기)
    // 이 함수는 객체를 받는다 SKY: "", PtY: "" 꼴로 되어있는 객체를 받는다.
    function pickWeatherIcon({SKY, PTY}) {
        // 객체 하나 받음
        // 그 안에서 SKY, PTY 만 사용
        // 호출 예 : pickWeatherIcon({SKY: 1, PTY: 0})
        const pty = Number(PTY ?? 0);
        const sky = Number(SKY ?? 1);
        // PTY 가 없으면 -> 0 (강수 없음)
        // SKY 가 없으면 -> 1 (맑음)
        // 문자열이어도 숫자로 강제 변환

        if (pty === 1 || pty === 4 || pty === 5) return {icon: "☔️", desc: "비"};
        if (pty === 2 || pty === 6) return {icon: "🌨️", desc: "비/눈"};
        if (pty === 3 || pty === 7) return {icon: "❄️", desc: "눈"};

        if (sky === 1) return {icon: "☀️", desc: "맑음"};
        if (sky === 3) return {icon: "☁️", desc: "구름많음"};
        return {icon: "☁️", desc: "흐림"}; // else
    }

    // 이 함수는 SKY: "", PtY: "" 꼴로 되어있는 객체를 받는다.
    function pickWeatherBannerImageUrl({SKY, PTY}) {
        const pty = Number(PTY ?? 0);
        const sky = Number(SKY ?? 1);
        // PTY 가 없으면 -> 0 (강수 없음)
        // SKY 가 없으면 -> 1 (맑음)
        // 문자열이어도 숫자로 강제 변환

        // 1) 비 2) 비/눈 3) 눈 4) 맑음 5) 구름많음 6) 흐림
        if (pty === 1 || pty === 4 || pty === 5) return "images/weather/1.png";  // 비
        if (pty === 2 || pty === 6) return "images/weather/2.png";               // 비/눈
        if (pty === 3 || pty === 7) return "images/weather/3.png";               // 눈

        if (sky === 1) return "images/weather/4.png"; // 맑음
        if (sky === 3) return "images/weather/5.png"; // 구름많음
        else return "images/weather/6.png";                // 흐림
    }



















































    // ======================프로필 수정======================
    const profileEditBtn = document.getElementById("profileEditBtn");
    const profileModal = document.getElementById("profileModal");
    const profileModalClose = document.getElementById("profileModalClose");

    const surveyForm = document.getElementById("profileSurveyForm");
    const calcBtn = document.getElementById("calcBtn");
    const totalScoreEl = document.getElementById("totalScore");
    const toneResultEl = document.getElementById("toneResult");

    function isLoggedIn() {
        // thymeleaf가 박아준 data-logged-in 값 사용
        // "true"/"false" 문자열로 들어옴
        return profileEditBtn?.dataset.loggedIn === "true";
    }

    function openProfileModal() {
        profileModal.style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    function closeProfileModal() {
        profileModal.style.display = "none";
        document.body.style.overflow = "";
    }

    // 버튼 클릭
    if (profileEditBtn) {
        profileEditBtn.addEventListener("click", () => {
            if (!isLoggedIn()) {
                alert("로그인을 해야합니다");
                return;
            }
            openProfileModal();
        });
    }

    // 닫기
    if (profileModalClose) profileModalClose.addEventListener("click", closeProfileModal);

    // 배경 클릭 닫기
    if (profileModal) {
        profileModal.addEventListener("click", (e) => {
            if (e.target === profileModal) closeProfileModal();
        });
    }

    // 총점 계산
    function getTotalScore() {

        if (!surveyForm) return 0;
        // surveyForm 이 null일 때 FormData 만들면 터지기 때문

        const formData = new FormData(surveyForm);
        const q1 = Number(formData.get("q1"));
        const q2 = Number(formData.get("q2"));
        const q3 = Number(formData.get("q3"));
        const q4 = Number(formData.get("q4"));
        const q5 = Number(formData.get("q5"));
        return q1 + q2 + q3 + q4 + q5; // 5~25
    }

    // ✅ 기준: 20점 이상이면 봄웜톤 (원하면 숫자 바꾸면 됨)
    function decideTone(totalScore) {
        if (totalScore >= 20) return "봄웜톤";
        return "봄웜톤 아님";
    }

    // 결과 계산 버튼
    if (calcBtn) {
        calcBtn.addEventListener("click", () => {
            if (!surveyForm.checkValidity()) {
                surveyForm.reportValidity();
                return;
            }
            const total = getTotalScore();
            totalScoreEl.textContent = String(total);
            toneResultEl.textContent = decideTone(total);
        });
    }

    // 저장
    if (surveyForm) {
        surveyForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!surveyForm.checkValidity()) {
                surveyForm.reportValidity();
                return;
            }

            const total = getTotalScore();
            const tone = decideTone(total);

            totalScoreEl.textContent = String(total);
            toneResultEl.textContent = tone;

            const payload = {
                totalScore: total,
                tone,
                answers: {
                    q1: Number(new FormData(surveyForm).get("q1")),
                    q2: Number(new FormData(surveyForm).get("q2")),
                    q3: Number(new FormData(surveyForm).get("q3")),
                    q4: Number(new FormData(surveyForm).get("q4")),
                    q5: Number(new FormData(surveyForm).get("q5")),
                }
            };

            // 1) 프론트 임시 저장(로컬)
            localStorage.setItem("profileSurvey", JSON.stringify(payload));

            // 2) 서버 저장 (백엔드 있으면 사용)
            // 아래 엔드포인트는 예시임. 너 서버에 맞게 바꾸면 됨.
            try {
                const res = await fetch("/profile/survey", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("save failed");
            } catch (err) {
                // 서버 없으면 여기 걸림. 로컬 저장은 이미 됐으니 너무 호들갑 떨지 말자.
                console.log("서버 저장 실패(로컬은 저장됨)", err);
            }

            alert(`저장 완료: ${tone} (총점 ${total})`);
            closeProfileModal();
        });
    }







</script>
